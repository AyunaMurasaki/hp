<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紫あゆな 公式ホームページ｜QRコードとご案内</title>
<meta name="description" content="紫あゆなの公式ホームページのご案内です。タップするとホームページが開きます。歌・ライブ、英語教室、ラジオ、お問い合わせのご案内はこちらから。">
<meta property="og:title" content="紫あゆな 公式ホームページ">
<meta property="og:description" content="タップするとホームページが開きます。歌・ライブ、英語教室、ラジオのご案内はこちらから。">
<meta property="og:image" content="https://ayunamurasaki.github.io/hp/assets/images/icon-portrait.jpg">
<meta property="og:image:width" content="900">
<meta property="og:image:height" content="900">
<meta property="og:image:alt" content="紫あゆな">

<meta property="og:site_name" content="紫あゆな 公式ホームページ">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://ayunamurasaki.github.io/hp/qr/">
<style>
:root{
  --turq:#7AA6C6;
  --turq-deep:#2F5D77;
  --turq-soft:#C2DCE4;
  --sky:#29A8E0;
  --sun:#E79FA0;
  --ink:#2B3A44;
  --ink-soft:#5A6B76;
  --paper:#FCFBF9;
  --line:#E4E9EC;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  color:var(--ink);
  background:var(--paper);
  line-height:1.8;
  font-size:16px;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%;display:block}
a{color:inherit}

.wrap{max-width:480px;margin:0 auto;padding:0 20px}

/* ---------- hero: 丸ごとタップで友だち追加 ---------- */
.hero-link{
  display:block;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(160deg,var(--turq-deep) 0%,var(--turq) 55%,var(--turq-soft) 100%);
  padding:44px 24px 34px;
  text-align:center;
}
.portrait{
  width:112px;height:112px;border-radius:50%;
  object-fit:cover;object-position:center 22%;
  margin:0 auto 16px;
  border:5px solid #fff;
  box-shadow:0 8px 20px rgba(47,93,119,.35);
}
.hero-link h1{
  margin:0 0 6px;
  font-size:24px;
  letter-spacing:.06em;
  font-weight:700;
}
.hero-link .sub{
  margin:0 0 22px;
  font-size:14px;
  letter-spacing:.04em;
  opacity:.92;
}
.qr-frame{
  width:172px;height:172px;
  margin:0 auto 20px;
  padding:10px;
  border-radius:14px;
  background:#fff;
  box-shadow:0 10px 24px rgba(47,93,119,.3);
}
.qr-frame img{width:100%;height:100%;object-fit:contain}
.cta{
  display:inline-block;
  background:#fff;
  color:var(--turq-deep);
  font-size:17px;font-weight:700;letter-spacing:.06em;
  padding:16px 34px;
  border-radius:999px;
  box-shadow:0 8px 18px rgba(47,93,119,.28);
}
.hero-link .tap-note{
  margin:14px 0 0;
  font-size:12.5px;
  opacity:.85;
}
.hero-link .idsearch{
  margin:6px 0 0;
  font-size:12.5px;
  opacity:.85;
  letter-spacing:.04em;
}

/* ---------- できること ---------- */
section.about{padding:34px 0 44px}
.about h2{
  font-size:15px;
  text-align:center;
  color:var(--ink-soft);
  letter-spacing:.06em;
  margin:0 0 18px;
  font-weight:700;
}
.about ul{
  list-style:none;
  margin:0;padding:0;
  display:grid;gap:10px;
}
.about li{
  display:flex;align-items:center;gap:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
  font-size:14.5px;
}
.about li a{flex:1;text-decoration:none}
.about li::before{
  content:"";
  flex:none;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--sun);
}

footer{padding:0 0 40px;text-align:center}
footer p{margin:0;font-size:11.5px;color:var(--ink-soft)}

@media (min-width:480px){
  .hero-link{padding:56px 24px 42px}
}
</style>
</head>
<body>

<a class="hero-link" href="https://ayunamurasaki.github.io/hp/">
  <img class="portrait" src="../assets/images/main-portrait.jpg" alt="紫あゆな">
  <h1>紫あゆな 公式ホームページ</h1>
  <p class="sub">タップするとホームページが開きます</p>
  <div class="qr-frame">
    <img src="../assets/images/hp-qr.png" alt="紫あゆな 公式ホームページのQRコード">
  </div>
  <span class="cta">ホームページはこちら</span>
  <p class="tap-note">画面をどこでもタップすると開きます</p>
  <p class="idsearch">ayunamurasaki.github.io/hp/</p>
</a>

<section class="about">
  <div class="wrap">
    <h2>ホームページのご案内</h2>
    <ul>
      <li><a href="../live.html">歌・ライブ</a></li>
      <li><a href="../english.html">英語教室</a></li>
      <li><a href="../radio.html">ラジオ</a></li>
      <li><a href="../contact.html">お問い合わせ</a></li>
    </ul>
  </div>
</section>

<footer>
  <p>&copy; 紫あゆな</p>
</footer>

</body>
</html>
